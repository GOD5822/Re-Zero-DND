<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Combat Simulator</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f1ea; --panel:#fffdf8; --text:#241c2c; --sub:#6b5f78;
  --accent:#7a3b8f; --accent2:#b8863f; --good:#3f8f5f; --bad:#c1425a; --line:#ddd3e5;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151020; --panel:#1e1830; --text:#efe8f7; --sub:#a596b8;
    --accent:#c99bdb; --accent2:#e0b878; --good:#6fd08f; --bad:#f07a90; --line:#382c4a;
  }
}
:root[data-theme="dark"]{
  --bg:#151020; --panel:#1e1830; --text:#efe8f7; --sub:#a596b8;
  --accent:#c99bdb; --accent2:#e0b878; --good:#6fd08f; --bad:#f07a90; --line:#382c4a;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,'Iowan Old Style',serif;padding:16px;max-width:900px;margin:0 auto;}
h1{font-size:1.4rem;margin:.2em 0;color:var(--accent);}
h2{font-size:1.05rem;margin:1.2em 0 .4em;color:var(--accent2);border-bottom:1px solid var(--line);padding-bottom:.2em;}
.sub{color:var(--sub);font-size:.85rem;margin-bottom:1em;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.col{flex:1 1 260px;min-width:0;}
select,input,button{font-family:inherit;font-size:.95rem;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%;}
button{background:var(--accent);color:#fff;border:none;cursor:pointer;font-weight:bold;width:auto;padding:8px 14px;}
button.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent);}
button:active{opacity:.8;}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:.78rem;margin-top:8px;}
.statgrid div span{color:var(--sub);}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:2px;}
.bar>i{display:block;height:100%;background:var(--good);}
.bar.mp>i{display:block;height:100%;background:var(--accent);}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:8px;overflow-x:auto;display:block;}
th,td{padding:5px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
tr.hl td{background:var(--accent);color:#fff;}
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:.75rem;background:var(--line);}
.dmg{color:var(--bad);font-weight:bold;}
.dealt{color:var(--good);font-weight:bold;}
details summary{cursor:pointer;color:var(--accent2);font-size:.85rem;}
#customResult{margin-top:8px;font-size:.9rem;}
.swapBtn{text-align:center;margin:4px 0;}
label{font-size:.78rem;color:var(--sub);display:block;margin-top:6px;}
footer{text-align:center;color:var(--sub);font-size:.75rem;margin:2em 0 1em;}
small.note{color:var(--sub);font-size:.72rem;}
.faction{font-size:.75rem;color:var(--sub);margin:-4px 0 4px;}
</style>
</head>

function mkChar(a){
  const c={name:a[0],str:+a[1],magStr:+a[2],fort:+a[3],agi:+a[4],int:+a[5],will:+a[6],cha:+a[7],wp:+a[8],mt:+a[9],mm:+a[10],faction:a[11]||"Player"};
  c.maxHp=rnd(220+c.fort); c.curHp=c.maxHp; c.curMp=c.mm; return c;
}
const state={chars:charsRaw.map(mkChar),atkIdx:46,defIdx:43,spellIdx:-1,defSpellIdx:-1,factionFilter:"all",lastRoll:null,lastBands:null};

function totalStats(c){return c.str+c.magStr+c.fort+c.agi+c.int+c.will+c.cha;}
function power(c){return Math.floor(Math.max(totalStats(c)-40,0)/15);}
function fortMult(fort){return clamp(0.35+0.65*65/(65+Math.sqrt(Math.max(fort,0))),0.35,1);}
function wpScale(wp){return clamp(0.5+0.015*(wp||0),0.5,2.0);}

function bands(a,d,spell,defSpell){
  const pAtk=power(a), pDef=power(d);
  const pdiff=Math.log10(pAtk+2)-Math.log10(pDef+2);
  const agiDiff=Math.log10((d.agi||0)+2)-Math.log10((a.agi||0)+2);
  const defMult=defSpell?((defSpell.pow/4)||0.3):0;
  let t1=clamp(rnd(d.wp*0.04-pdiff*1.6+defMult*3),1,5);
  let t2=clamp(t1+clamp(rnd(agiDiff*3.5),1,5),t1,14);
  let t3=clamp(t2+clamp(rnd(6-pdiff*2.2),1,6),t2,16);
  let t4=clamp(t3+clamp(rnd(d.wp*0.035+defMult*2),1,5),t3,17);
  const crit=clamp(20-rnd(2+pdiff*2.2+a.wp*0.03),t4+2,20);

  const usingSpell=!!spell;
  const offense=usingSpell?a.magStr*((spell.pow/4)||0.3):a.str;
  const scale=usingSpell?1:wpScale(a.wp);
  const raw=offense*scale;
  const effFort=d.fort*(1+defMult*0.6);
  const dmgBase=Math.max(1,rnd(raw*fortMult(effFort)));
  const counterDmg=Math.max(0,rnd(d.str*wpScale(d.wp)*fortMult(a.fort)*0.25));

  return [
    {name:"Perfect Block",min:1,max:t1,dDef:0,dAtk:counterDmg,note:"defender fully negates + counters"},
    {name:"Evade",min:t1+1,max:t2,dDef:0,dAtk:0,note:"defender dodges clean"},
    {name:"Failed Hit",min:t2+1,max:t3,dDef:0,dAtk:0,note:"attack simply misses"},
    {name:"Block",min:t3+1,max:t4,dDef:Math.max(1,rnd(dmgBase*0.35)),dAtk:0,note:"partial mitigation"},
    {name:"Successful Hit",min:t4+1,max:crit-1,dDef:dmgBase,dAtk:0,note:"clean connect"},
    {name:"Critical Hit",min:crit,max:20,dDef:rnd(dmgBase*1.75),dAtk:0,note:"maximum punish"}
  ];
}

function el(id){return document.getElementById(id);}
function factionOptions(){
  const facs=[...new Set(state.chars.map(c=>c.faction))].sort();
  return `<option value="all" ${state.factionFilter=="all"?"selected":""}>All Factions</option>`+
    facs.map(f=>`<option value="${f}" ${state.factionFilter==f?"selected":""}>${f}</option>`).join("");
}
function charOptions(sel){
  return state.chars.map((c,i)=>[c,i]).filter(([c])=>state.factionFilter=="all"||c.faction===state.factionFilter)
    .map(([c,i])=>`<option value="${i}" ${i==sel?"selected":""}>${c.name}</option>`).join("");
}
function spellOptions(selIdx,noneLabel){
  const groups={};
  spellsRaw.forEach((s,i)=>{(groups[s.el]=groups[s.el]||[]).push([s,i]);});
  let html=`<option value="-1" ${selIdx==-1?"selected":""}>${noneLabel}</option>`;
  for(const g in groups){
    html+=`<optgroup label="${g}">`+groups[g].map(([s,i])=>`<option value="${i}" ${selIdx==i?"selected":""}>${s.name}${s.pow===0?" (support)":""} · ×${(s.pow/4).toFixed(2)} MagStr · ${s.mp}mp</option>`).join("")+`</optgroup>`;
  }
  return html;
}
function statCard(c,role){
  return `<div class="panel"><b>${role}: ${c.name}</b>
  <div class="faction">${c.faction}</div>
  <div class="statgrid">
   <div><span>STR</span> ${fmt(c.str)}</div><div><span>Magical Str</span> ${fmt(c.magStr)}</div>
   <div><span>Fortitude</span> ${fmt(c.fort)}</div><div><span>Agility</span> ${fmt(c.agi)}</div>
   <div><span>INT</span> ${c.int}</div><div><span>Will</span> ${c.will}</div>
   <div><span>Charisma</span> ${c.cha}</div><div><span>Weapon Prof.</span> ${c.wp}</div>
   <div><span>Mana Talent</span> ${c.mt}</div><div><span>Mana Mastery</span> ${c.mm}</div>
   <div><span>Power</span> ${fmt(power(c))}</div><div><span>Max HP</span> ${fmt(c.maxHp)}</div>
  </div>
  <div style="margin-top:6px;font-size:.8rem;color:var(--sub)">HP ${fmt(c.curHp)}/${fmt(c.maxHp)}</div>
  <div class="bar"><i style="width:${clamp(c.curHp/c.maxHp*100,0,100)}%"></i></div>
  <div style="margin-top:4px;font-size:.8rem;color:var(--sub)">MP ${c.curMp}/${c.mm}</div>
  <div class="bar mp"><i style="width:${c.mm?clamp(c.curMp/c.mm*100,0,100):0}%"></i></div>
  </div>`;
}

function render(){
  const a=state.chars[state.atkIdx], d=state.chars[state.defIdx];
  const spell=state.spellIdx>=0?spellsRaw[state.spellIdx]:null;
  const defSpell=state.defSpellIdx>=0?spellsRaw[state.defSpellIdx]:null;
  const bd=bands(a,d,spell,defSpell);
  state.lastBands=bd;

  el("app").innerHTML=`
  <div class="panel">
    <label>Filter by faction</label>
    <select onchange="setFactionFilter(this.value)">${factionOptions()}</select>
    <div class="row" style="margin-top:6px">
      <div class="col"><label>Attacker</label><select onchange="setFighter('atk',this.value)">${charOptions(state.atkIdx)}</select></div>
      <div class="col"><label>Defender</label><select onchange="setFighter('def',this.value)">${charOptions(state.defIdx)}</select></div>
    </div>
    <div class="swapBtn"><button class="secondary" onclick="swap()">⇄ Swap roles</button></div>
    <label>Attacker's action</label>
    <select onchange="setSpell(this.value)">${spellOptions(state.spellIdx,"— Basic Attack (STR + weapon) —")}</select>
    ${spell&&a.curMp<spell.mp?`<div style="color:var(--bad);font-size:.8rem;margin-top:4px">⚠ ${a.name} only has ${a.curMp} mana mastery left, this costs ${spell.mp}.</div>`:""}
    <label>Defender's reaction</label>
    <select onchange="setDefSpell(this.value)">${spellOptions(state.defSpellIdx,"— Passive Defense (stats only) —")}</select>
    ${defSpell&&d.curMp<defSpell.mp?`<div style="color:var(--bad);font-size:.8rem;margin-top:4px">⚠ ${d.name} only has ${d.curMp} mana mastery left, this costs ${defSpell.mp}.</div>`:""}
  </div>

  <div class="row">
    <div class="col">${statCard(a,"Attacker")}</div>
    <div class="col">${statCard(d,"Defender")}</div>
  </div>

  <h2>Minimum d20 roll per outcome</h2>
  <div class="panel">
  <table><tr><th>Outcome</th><th>Min roll</th><th>Range</th><th>Dmg→Def</th><th>Dmg→Atk</th></tr>
  ${bd.map(b=>`<tr id="row_${b.name.replace(/\s/g,'')}"><td>${b.name}</td><td><b>${b.min}</b></td><td>${b.min}–${b.max}</td>
    <td class="dmg">${fmt(b.dDef)}</td><td class="dmg">${fmt(b.dAtk)}</td></tr>`).join("")}
  </table>
  <details style="margin-top:8px"><summary>How this is calculated</summary>
  <div style="font-size:.78rem;color:var(--sub);margin-top:6px">
  Power = floor(max(STR+MagicalStr+Fort+AGI+INT+Will+Cha−40,0)/15) for both fighters. The six d20 bands (Perfect Block→Evade→Failed Hit→Block→Successful Hit→Critical Hit) come from log-scaled Power difference, log-scaled Agility difference, and the defender's Weapon Proficiency — if the defender picks a reactive spell/action, its power (÷4) nudges the Perfect Block and Block bands wider and boosts their effective Fortitude for this exchange (+60% of the spell's multiplier).
  Raw damage = attacker's STR × weapon scaling (50%+1.5%×WP, capped 200%) for a basic attack, or Magical Strength × (spell power÷4) for a spell (no weapon scaling). That's then multiplied by the Fortitude mitigation curve: 0.35+0.65×65/(65+√Fortitude), floor 35%. Block = 35% of that, Critical = 175%. Perfect Block instead counters for 25% of the defender's own weapon-scaled STR, mitigated by the attacker's Fortitude. Max HP = 220+Fortitude; Mana pool = Mana Mastery.
  </div></details>
  </div>

  <h2>Roll it</h2>
  <div class="panel">
    <div class="row">
      <div class="col"><label>Custom roll (1–20)</label><input id="rollInput" type="number" min="1" max="20" value="${state.lastRoll||''}"></div>
      <div class="col" style="display:flex;align-items:flex-end;gap:8px">
        <button onclick="checkRoll()">Check roll</button>
        <button class="secondary" onclick="randomRoll()">🎲 Random</button>
      </div>
    </div>
    <div id="customResult"></div>
  </div>

  <h2>Add / reset characters</h2>
  <div class="panel">
    <button class="secondary" onclick="resetHpMp()">Reset HP &amp; MP for both fighters</button>
    <details style="margin-top:10px"><summary>Add a custom character</summary>
    <div id="addForm" class="row" style="margin-top:8px">
      <div class="col" style="flex-basis:160px"><label>name</label><input id="nf_name" type="text"></div>
      <div class="col" style="flex-basis:160px"><label>faction</label><input id="nf_faction" type="text" placeholder="Player"></div>
      ${["str","magStr","fort","agi","int","will","cha","wp","mt","mm"].map(f=>`
      <div class="col" style="flex-basis:110px"><label>${f}</label><input id="nf_${f}" type="number" value="0"></div>`).join("")}
    </div>
    <small class="note">str/magStr/fort/agi can be any size; int/will/cha/wp are 0–100; mt (mana talent) 0–40; mm (mana mastery) 0–100. Faction defaults to "Player" if left blank.</small><br>
    <button style="margin-top:8px" onclick="addChar()">Add character</button>
    </details>
  </div>
  `;
  if(state.lastRoll) checkRoll();
}

function setFighter(role,v){ state[role+"Idx"]=+v; state.lastRoll=null; render(); }
function setSpell(v){ state.spellIdx=+v; state.lastRoll=null; render(); }
function setDefSpell(v){ state.defSpellIdx=+v; state.lastRoll=null; render(); }
function setFactionFilter(v){
  state.factionFilter=v;
  const matches=i=>state.factionFilter=="all"||state.chars[i].faction===state.factionFilter;
  if(!matches(state.atkIdx)) state.atkIdx=state.chars.findIndex((c,i)=>matches(i));
  if(!matches(state.defIdx)) state.defIdx=state.chars.findIndex((c,i)=>matches(i));
  state.lastRoll=null; render();
}
function swap(){ [state.atkIdx,state.defIdx]=[state.defIdx,state.atkIdx]; [state.spellIdx,state.defSpellIdx]=[state.defSpellIdx,state.spellIdx]; state.lastRoll=null; render(); }
function findBand(roll){ return state.lastBands.find(b=>roll>=b.min&&roll<=b.max); }

function checkRoll(){
  const v=clamp(parseInt(el("rollInput").value)||0,1,20);
  el("rollInput").value=v; state.lastRoll=v;
  state.lastBands.forEach(b=>{const r=el("row_"+b.name.replace(/\s/g,''));if(r)r.classList.remove("hl");});
  const b=findBand(v);
  const row=el("row_"+b.name.replace(/\s/g,'')); if(row) row.classList.add("hl");
  el("customResult").innerHTML=`Rolled <b>${v}</b> → <span class="badge">${b.name}</span> — ${b.note}.
   <span class="dealt">Dmg to defender: ${fmt(b.dDef)}</span> · <span class="dmg">Dmg to attacker: ${fmt(b.dAtk)}</span>
   <div style="margin-top:6px"><button onclick="applyDamage()">Apply to HP/MP</button></div>`;
}
function randomRoll(){ el("rollInput").value=Math.floor(Math.random()*20)+1; checkRoll(); }

function applyDamage(){
  if(!state.lastRoll) return;
  const b=findBand(state.lastRoll);
  const a=state.chars[state.atkIdx], d=state.chars[state.defIdx];
  d.curHp=clamp(d.curHp-b.dDef,0,d.maxHp);
  a.curHp=clamp(a.curHp-b.dAtk,0,a.maxHp);
  if(state.spellIdx>=0){ const s=spellsRaw[state.spellIdx]; a.curMp=clamp(a.curMp-s.mp,0,a.mm); }
  if(state.defSpellIdx>=0){ const s=spellsRaw[state.defSpellIdx]; d.curMp=clamp(d.curMp-s.mp,0,d.mm); }
  render();
}
function resetHpMp(){
  [state.atkIdx,state.defIdx].forEach(i=>{const c=state.chars[i]; c.curHp=c.maxHp; c.curMp=c.mm;});
  render();
}
function addChar(){
  const g=f=>el("nf_"+f).value;
  if(!g("name")){ alert("Give the character a name."); return; }
  const c=mkChar([g("name"),g("str"),g("magStr"),g("fort"),g("agi"),g("int"),g("will"),g("cha"),g("wp"),g("mt"),g("mm"),g("faction")]);
  state.chars.push(c); state.atkIdx=state.chars.length-1; state.factionFilter="all"; render();
}
render();
</script>
</body>
</html>
